<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 관리</title>

<style>
  :root {
    --line: #e2e4e8;
    --muted: #8a9099;
    --work: #2f6fed;
    --personal: #1f9d55;
    --study: #8b5cf6;
  }

  body {
    max-width: 600px;
    margin: 0 auto;
    padding: 32px 20px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", sans-serif;
    color: #22262b;
    line-height: 1.6;
  }

  h1 {
    margin: 0 0 16px;
    font-size: 24px;
  }

  #progress,
  #input-row,
  #filters {
    margin-bottom: 16px;
  }

  #todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }

  #todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }

  .todo-text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .badge {
    flex: none;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: #fff;
    white-space: nowrap;
  }

  .badge-work { background: var(--work); }
  .badge-personal { background: var(--personal); }
  .badge-study { background: var(--study); }
</style>

<h1>할 일 관리</h1>

<div id="progress"></div>
<div id="input-row"></div>
<div id="filters"></div>

<ul id="todo-list"></ul>

<script>
  const STORAGE_KEY = "todoApp.v1";
  const CATEGORY_LABELS = { work: "업무", personal: "개인", study: "공부" };

  let todos = [];
  let currentFilter = "all";
  let editingId = null;

  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function loadTodos() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      todos = Array.isArray(saved && saved.todos) ? saved.todos : [];
    } catch (e) {
      todos = [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, todos }));
  }

  function renderList() {
    const list = document.getElementById("todo-list");
    list.innerHTML = "";

    todos.forEach(function (todo) {
      const li = document.createElement("li");

      const text = document.createElement("span");
      text.className = "todo-text";
      text.textContent = todo.text;

      const badge = document.createElement("span");
      badge.className = "badge badge-" + todo.category;
      badge.textContent = CATEGORY_LABELS[todo.category];

      li.append(text, badge);
      list.append(li);
    });
  }

  function render() {
    renderList();
  }

  loadTodos();
  render();
</script>
