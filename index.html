<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 관리</title>

<style>
  :root {
    --line: #e2e4e8;
    --muted: #8a9099;
    --work: #2f6fed;
    --personal: #1f9d55;
    --study: #8b5cf6;
  }

  body {
    max-width: 600px;
    margin: 0 auto;
    padding: 32px 20px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", sans-serif;
    color: #22262b;
    line-height: 1.6;
  }

  h1 {
    margin: 0 0 16px;
    font-size: 24px;
  }

  #progress,
  #input-row,
  #filters {
    margin-bottom: 16px;
  }

  #todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }

  #todo-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }

  .todo-text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .todo-text.done {
    color: var(--muted);
    text-decoration: line-through;
  }

  #todo-list input[type="checkbox"] {
    flex: none;
    width: 17px;
    height: 17px;
    cursor: pointer;
  }

  .row-btn {
    flex: none;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: #4a5058;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  .row-btn:hover {
    border-color: var(--muted);
  }

  .badge {
    flex: none;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: #fff;
    white-space: nowrap;
  }

  .badge-work { background: var(--work); }
  .badge-personal { background: var(--personal); }
  .badge-study { background: var(--study); }

  #input-row {
    display: flex;
    gap: 8px;
  }

  #todo-input {
    flex: 1;
    min-width: 0;
  }

  #input-row input,
  #input-row select,
  #input-row button {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
  }

  #add-btn {
    flex: none;
    border-color: var(--work);
    background: var(--work);
    color: #fff;
    cursor: pointer;
  }

  #todo-list li.empty {
    display: block;
    padding: 32px 0;
    border-bottom: none;
    color: var(--muted);
    text-align: center;
  }
</style>

<h1>할 일 관리</h1>

<div id="progress"></div>

<div id="input-row">
  <input id="todo-input" type="text" placeholder="할 일을 입력하세요">
  <select id="category-select">
    <option value="work">업무</option>
    <option value="personal">개인</option>
    <option value="study">공부</option>
  </select>
  <button id="add-btn">추가</button>
</div>

<div id="filters"></div>

<ul id="todo-list"></ul>

<script>
  const STORAGE_KEY = "todoApp.v1";
  const CATEGORY_LABELS = { work: "업무", personal: "개인", study: "공부" };

  let todos = [];
  let currentFilter = "all";
  let editingId = null;

  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function loadTodos() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      todos = Array.isArray(saved && saved.todos) ? saved.todos : [];
    } catch (e) {
      todos = [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, todos }));
  }

  function addTodo() {
    const input = document.getElementById("todo-input");
    const text = input.value.trim();
    if (text === "") {
      input.focus();
      return;
    }

    todos.unshift({
      id: createId(),
      text: text,
      category: document.getElementById("category-select").value,
      done: false,
      createdAt: Date.now()
    });

    saveTodos();
    render();

    input.value = "";
    input.focus();
  }

  function toggleTodo(id) {
    const todo = todos.find(function (t) { return t.id === id; });
    todo.done = !todo.done;
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    if (!confirm("이 할 일을 삭제할까요?")) return;
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function renderList() {
    const list = document.getElementById("todo-list");
    list.innerHTML = "";

    if (todos.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "할 일을 추가해 보세요";
      list.append(empty);
      return;
    }

    todos.forEach(function (todo) {
      const li = document.createElement("li");
      li.dataset.id = todo.id;

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = todo.done;
      check.dataset.action = "toggle";

      const text = document.createElement("span");
      text.className = todo.done ? "todo-text done" : "todo-text";
      text.textContent = todo.text;

      const badge = document.createElement("span");
      badge.className = "badge badge-" + todo.category;
      badge.textContent = CATEGORY_LABELS[todo.category];

      const del = document.createElement("button");
      del.className = "row-btn";
      del.dataset.action = "delete";
      del.textContent = "삭제";

      li.append(check, text, badge, del);
      list.append(li);
    });
  }

  function render() {
    renderList();
  }

  document.getElementById("add-btn").addEventListener("click", addTodo);

  // 목록 안의 클릭은 여기 한 곳에서만 처리한다 (이벤트 위임)
  document.getElementById("todo-list").addEventListener("click", function (e) {
    const action = e.target.dataset.action;
    if (!action) return;

    const id = e.target.closest("li").dataset.id;
    if (action === "toggle") toggleTodo(id);
    else if (action === "delete") deleteTodo(id);
  });

  document.getElementById("todo-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTodo();
  });

  loadTodos();
  render();
</script>
